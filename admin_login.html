{% extends "base.html" %}{% block title %}ورود مدیریت | Free CP{% endblock %}{% block body %}
<section class="card narrow"><div class="brand">FREE <span>CP</span></div><h2>ورود مدیریت</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<label>G:</label><input name="g" required autocomplete="username" placeholder="نام کاربری مدیریت">
<label>P:</label><input name="p" type="password" required autocomplete="current-password" placeholder="رمز مدیریت">
<button type="submit">ورود به پنل</button></form><a class="admin-link" href="/">بازگشت به گردونه</a></section>
{% endblock %}
