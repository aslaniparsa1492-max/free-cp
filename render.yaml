services:
  - type: web
    name: free-cp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_G
        sync: false
      - key: ADMIN_P
        sync: false
      - key: DATABASE_PATH
        value: /var/data/free_cp.db
    disk:
      name: free-cp-data
      mountPath: /var/data
      sizeGB: 1
